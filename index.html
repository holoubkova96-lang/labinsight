<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LabInsight – interactive analytics dashboard for a clinical laboratory (fictional data)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>LabInsight</title>
    <script>
      // Téma nastavíme před vykreslením, aby stránka neblikla
      try {
        const t = localStorage.getItem('labinsight.theme');
        const dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
