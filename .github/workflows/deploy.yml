# Sestaví aplikaci a nasadí ji na GitHub Pages při každém pushi do větve main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # ruční spuštění z karty Actions

permissions:
  contents: read
  actions: read # stažení artefaktu předchozího nasazení
  pages: write
  id-token: write

# Běží vždy jen jedno nasazení; rozjeté se nezruší, aby nezůstal napůl nasazený web
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, type-check and test
        run: |
          npm run lint
          npm test

      - name: Build
        run: npm run build

      # GitHub Pages i prohlížeče drží index.html až 10 minut v cache. Aby stará
      # verze stránky nehledala smazané soubory, ponecháme assety předchozího nasazení.
      - name: Keep assets of the previous deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$prev" ] && gh run download "$prev" --repo "$GITHUB_REPOSITORY" -n github-pages -D prev; then
            mkdir -p prev_site && tar -xf prev/artifact.tar -C prev_site
            cp -n prev_site/assets/* dist/assets/ 2>/dev/null || true
            echo "Kept $(ls prev_site/assets | wc -l) previous assets"
          else
            echo "No previous artifact available – skipping"
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
