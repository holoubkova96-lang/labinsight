# Sestaví aplikaci a nasadí ji na GitHub Pages při každém pushi do větve main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # ruční spuštění z karty Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Běží vždy jen jedno nasazení; rozjeté se nezruší, aby nezůstal napůl nasazený web
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, type-check and test
        run: |
          npm run lint
          npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
